<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penshurst Park Cricket Club</title>
<style>
:root{--navy:#0b2447;--yel:#f5c518;--bg:#fff;--fg:#0b2447;--card:#f3f5fa;--mut:#5a6785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07162e;--fg:#fff;--card:#10264d;--mut:#b6c2dc}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--fg)}
h1,h2,h3,nav,button,label,select,input,.tag{font-family:system-ui,Segoe UI,Arial,sans-serif}
.skip-link{position:absolute;left:12px;top:-80px;z-index:1000;background:var(--yel);color:var(--navy);padding:10px 14px;border-radius:0 0 8px 8px;font:700 .9rem system-ui;text-decoration:none}.skip-link:focus{top:0}
header{background:var(--navy);color:#fff;border-bottom:5px solid var(--yel);display:flex;align-items:center;gap:24px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;font:700 1.1rem system-ui;color:#fff;text-decoration:none}
.menu-toggle{display:none;margin-left:auto;padding:7px 11px;background:transparent;color:#fff;border:2px solid var(--yel)}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1;margin-left:12px}nav a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:.9rem;white-space:nowrap}
nav a.on,nav a:hover{background:var(--yel);color:var(--navy)}
@media(max-width:760px){header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:8px 12px}.brand{min-width:0}.brand img{width:39px;height:auto}.menu-toggle{display:inline-block}nav{display:none;grid-column:1/-1;margin:4px 0 0;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);flex-direction:column;gap:4px}nav.open{display:flex}nav a,.navsoon{display:flex;align-items:center;width:100%;min-height:44px;padding:10px 12px;font-size:1rem}.menu-toggle,.btn,button{min-height:44px}.navsoon{border-radius:6px;background:rgba(255,255,255,.08)} }
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
.menu-toggle:focus-visible{outline-color:#fff;outline-width:3px;outline-offset:3px}
#app h1[tabindex="-1"]:focus,#app h2[tabindex="-1"]:focus{outline:none;border-left:4px solid var(--yel);padding-left:10px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}.slide{animation:none!important;transform:none!important;opacity:1}.slide:not(:first-child){display:none}}
.role select{padding:4px;border-radius:6px}
main{max-width:1250px;margin:auto;padding:16px}
.hero{position:relative;overflow:hidden;border-radius:12px;border:4px solid var(--yel);color:#fff;min-height:230px;display:flex;align-items:flex-end;background:var(--navy)}
.slide{position:absolute;inset:0;opacity:0;animation:fade 24s infinite;transform-origin:center}
.slide:nth-child(2){animation-delay:8s}.slide:nth-child(3){animation-delay:16s}
@keyframes fade{0%{opacity:0;transform:scale(1)}8%{opacity:1}33%{opacity:1}41%{opacity:0;transform:scale(1.18)}100%{opacity:0;transform:scale(1.18)}}
.hero .txt{position:relative;padding:18px;background:linear-gradient(rgba(11,36,71,.72),rgba(11,36,71,.98));width:100%}
.grid{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:10px;padding:14px;border-left:5px solid var(--yel);margin-bottom:12px}
.card h3,h2{margin:.2em 0 .5em}.mut{color:var(--mut);font-size:.9rem}
.photo{height:110px;border-radius:8px;margin-bottom:8px;background:linear-gradient(135deg,var(--navy),#27498b);display:flex;align-items:center;justify-content:center;color:var(--yel);font:600 .8rem system-ui;text-align:center}
button,.btn{background:var(--navy);color:#fff;border:2px solid var(--yel);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block}
button.y,.btn.y{background:var(--yel);color:var(--navy);font-weight:700}
input,select,textarea{padding:7px;border-radius:6px;border:1px solid var(--mut);margin:3px 0;max-width:100%;background:var(--bg);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.tl{border-left:4px solid var(--yel);margin-left:8px;padding-left:16px}.tl div{margin-bottom:16px;position:relative}
.tl div:before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--navy);border:3px solid var(--yel)}
.tag{display:inline-block;font-size:.7rem;padding:1px 7px;border-radius:9px;background:var(--yel);color:var(--navy);font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}caption{text-align:left;font:700 1rem system-ui;padding:0 0 8px}td,th{padding:6px;border-bottom:1px solid var(--mut);text-align:left;font:.9rem system-ui}th{font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.note{background:#fff8d6;color:#4a3b00;border-radius:8px;padding:8px 12px;font:.85rem system-ui;margin:10px 0}
.follow{background:var(--card);border-top:5px solid var(--yel);padding:18px;text-align:center;margin-top:20px}.follow h3{margin:0 0 10px}.follow .btn{margin:4px}footer{text-align:center;padding:20px;background:var(--navy);color:#fff;border-top:5px solid var(--yel);margin-top:20px;font:.85rem system-ui}
.btn[aria-disabled]{opacity:.65;cursor:default;border-style:dashed}.navsoon{color:#fff;opacity:.6;padding:6px 10px;font-size:.9rem}
</style></head><body>
